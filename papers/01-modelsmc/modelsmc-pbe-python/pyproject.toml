[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelsmc-pbe"
version = "0.1.0"
description = "Standalone ModelSMC research framework for programming by example"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "ModelSMC reading group" }]
dependencies = [
  "httpx==0.28.1",
  "numpy==2.5.1",
  "pydantic==2.13.4",
  "rich==14.3.3",
  "torch==2.13.0",
  "typer==0.27.1",
]

[dependency-groups]
dev = [
  "hypothesis==6.165.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[project.scripts]
modelsmc-pbe = "modelsmc_pbe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/modelsmc_pbe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["modelsmc_pbe"]

[tool.uv]
package = true
